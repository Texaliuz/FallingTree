name: Wiki

on:
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test
        run: |
          echo ${{ format('refs/heads/{0}', github.event.repository.default_branch) }}
          echo ${{ github.ref }}
  
  wiki:
    permissions:
      contents: write
    uses: RakambdaOrg/rakambda-github-workflows/.github/workflows/sync-wiki.yml@main
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    with:
      path: wiki/
